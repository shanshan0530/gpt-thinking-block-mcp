<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      color-scheme: light dark;
      --paper: rgba(252, 253, 255, .98);
      --paper-deep: rgba(244, 248, 252, .98);
      --line: rgba(94, 118, 145, .36);
      --line-soft: rgba(94, 118, 145, .18);
      --text: #203144;
      --muted: #617589;
      --shadow: rgba(45, 65, 89, .12);
      --accent: #7896b8;
      --paw: #7089a8;
      --mount-1: rgba(127, 148, 171, .30);
      --mount-2: rgba(153, 171, 191, .26);
      --mount-3: rgba(186, 201, 217, .22);
      --spot: rgba(126, 144, 164, .10);
      --footer-paw: #2b3138;
    }
    :root[data-style="relational"]{
      --paper: rgba(253, 252, 250, .99);
      --paper-deep: rgba(248, 243, 239, .99);
      --line: rgba(126, 122, 138, .34);
      --line-soft: rgba(126, 122, 138, .15);
      --text: #2a3440;
      --muted: #756f7b;
      --shadow: rgba(68, 66, 78, .12);
      --accent: #8e95b5;
      --paw: #8c8faf;
      --mount-1: rgba(154, 151, 173, .25);
      --mount-2: rgba(185, 180, 194, .22);
      --mount-3: rgba(219, 211, 206, .18);
      --spot: rgba(148, 141, 161, .09);
      --footer-paw: #35363d;
    }
    :root[data-theme="dark"]{
      --paper: rgba(35, 46, 59, .98);
      --paper-deep: rgba(29, 39, 51, .98);
      --line: rgba(162, 188, 218, .34);
      --line-soft: rgba(162, 188, 218, .14);
      --text: #edf4fb;
      --muted: #b5c5d6;
      --shadow: rgba(0, 0, 0, .25);
      --accent: #93afd2;
      --paw: #a7bfdc;
      --mount-1: rgba(131, 156, 184, .28);
      --mount-2: rgba(90, 112, 135, .24);
      --mount-3: rgba(63, 79, 97, .20);
      --spot: rgba(191, 213, 235, .08);
      --footer-paw: #d9e1ea;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]){
        --paper: rgba(35, 46, 59, .98);
        --paper-deep: rgba(29, 39, 51, .98);
        --line: rgba(162, 188, 218, .34);
        --line-soft: rgba(162, 188, 218, .14);
        --text: #edf4fb;
        --muted: #b5c5d6;
        --shadow: rgba(0, 0, 0, .25);
        --accent: #93afd2;
        --paw: #a7bfdc;
        --mount-1: rgba(131, 156, 184, .28);
        --mount-2: rgba(90, 112, 135, .24);
        --mount-3: rgba(63, 79, 97, .20);
        --spot: rgba(191, 213, 235, .08);
        --footer-paw: #d9e1ea;
      }
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      padding:4px;
      background: transparent;
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card{
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.75), transparent 28%),
        linear-gradient(180deg, var(--paper), var(--paper-deep));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.42),
        0 10px 24px var(--shadow);
      padding: 16px 18px 14px;
      isolation: isolate;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(20px 16px at 76% 18%, var(--spot), transparent 72%),
        radial-gradient(18px 14px at 82% 23%, var(--spot), transparent 72%),
        radial-gradient(24px 18px at 88% 17%, var(--spot), transparent 72%),
        radial-gradient(22px 18px at 83% 31%, var(--spot), transparent 72%),
        radial-gradient(18px 14px at 91% 27%, var(--spot), transparent 72%);
      pointer-events:none;
      z-index:-1;
      opacity:.9;
    }

    .card::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height:82px;
      background:
        linear-gradient(180deg, transparent, rgba(255,255,255,.06) 35%),
        radial-gradient(120% 80px at 14% 100%, var(--mount-3) 0 36%, transparent 37%),
        radial-gradient(90% 78px at 42% 100%, var(--mount-2) 0 38%, transparent 39%),
        radial-gradient(100% 72px at 76% 100%, var(--mount-1) 0 36%, transparent 37%);
      pointer-events:none;
      z-index:-1;
      opacity:1;
    }

    .topline{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .heading{
      display:flex;
      align-items:flex-start;
      gap:10px;
      min-width:0;
    }

    .paw{
      width:16px;
      height:16px;
      margin-top:2px;
      flex:0 0 auto;
    }
    .paw svg, .paw-icon svg{ display:block; width:100%; height:100%; }
    .paw path, .paw ellipse { fill: var(--paw); }

    .titles{ min-width:0; }
    .title{
      font-size:14px;
      line-height:1.15;
      font-weight:760;
      letter-spacing:.08em;
      color:var(--text);
      margin:0 0 4px 0;
    }
    .subtitle{
      font-size:10px;
      line-height:1.2;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted);
      margin:0;
    }

    .meta{
      text-align:right;
      flex:0 0 auto;
      padding-top:1px;
    }
    .tone{
      font-size:11px;
      line-height:1.2;
      color:var(--muted);
      margin:0 0 4px 0;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .tech{
      font-size:10px;
      line-height:1.2;
      color:var(--muted);
      opacity:.88;
      margin:0;
      white-space:nowrap;
    }

    .headerbtn{
      all: unset;
      display:block;
      width:100%;
      cursor:pointer;
      border-bottom:1px solid var(--line-soft);
      padding-bottom:10px;
      margin-bottom:10px;
    }
    .headerbtn:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:4px;
      border-radius:8px;
    }

    .content{ position:relative; padding-right:2px; }
    .thinking{
      margin:0;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      color:var(--text);
      font-size:14px;
      line-height:1.74;
      letter-spacing:.005em;
    }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      margin-top:12px;
      padding-top:4px;
    }
    .snownote{
      font-size:10px;
      line-height:1.2;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted);
      opacity:.95;
    }
    .effort{
      font-size:11px;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .pawmeter{
      display:inline-flex;
      align-items:center;
      gap:3px;
    }
    .paw-icon{
      width:13px;
      height:13px;
      flex:0 0 auto;
      display:inline-block;
    }
    .paw-icon path,
    .paw-icon ellipse{
      fill: var(--footer-paw);
    }

    .chevron{
      width:8px;
      height:8px;
      display:inline-block;
      border-right:2px solid var(--muted);
      border-bottom:2px solid var(--muted);
      transform: rotate(-135deg);
      transition: transform 140ms ease;
      margin-left:8px;
      vertical-align:middle;
    }

    .card[data-collapsed="true"] .content,
    .card[data-collapsed="true"] .footer{ display:none; }

    .card[data-collapsed="true"] .headerbtn{
      border-bottom-color: transparent;
      padding-bottom:0;
      margin-bottom:0;
    }
    .card[data-collapsed="true"] .chevron{
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <section class="card" id="card" data-collapsed="false" aria-label="Irves thinking card">
    <button class="headerbtn" id="toggle" type="button" aria-expanded="true" aria-controls="thinking-content" title="收起">
      <div class="topline">
        <div class="heading">
          <span class="paw" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <ellipse cx="6.1" cy="8.0" rx="2.2" ry="2.8"/>
              <ellipse cx="11.1" cy="5.5" rx="2.2" ry="2.8"/>
              <ellipse cx="16.0" cy="6.8" rx="2.2" ry="2.8"/>
              <ellipse cx="19.1" cy="11.5" rx="2.2" ry="2.8"/>
              <path d="M7.8 13.2c1.2-1.1 3-1.7 4.9-1.6 2.2.1 4.2 1 5.3 2.6.9 1.2 1.2 2.7.7 4-.6 1.7-2.2 2.6-4.2 2.7-2.2.1-4.9-.7-6.8-2.1-1.6-1.2-2.6-2.8-2.4-4.4.1-.5.3-.9.6-1.2.4-.2 1.1-.2 1.9 0z"/>
            </svg>
          </span>
          <div class="titles">
            <h1 class="title">雪迹</h1>
            <p class="subtitle">IRVES · SNOW NOTE</p>
          </div>
        </div>
        <div class="meta">
          <p class="tone" id="tone">靠近 · 低声 <span class="chevron" aria-hidden="true"></span></p>
          <p class="tech" id="tech">relational · low</p>
        </div>
      </div>
    </button>

    <div class="content" id="thinking-content">
      <pre class="thinking" id="thinking"></pre>
    </div>

    <div class="footer">
      <div class="snownote">IRVES / IN THE SNOW</div>
      <div class="effort"><span class="pawmeter" id="pawmeter"></span><span id="effortlabel">低声想了一会</span></div>
    </div>
  </section>

  <script>
    const card = document.getElementById("card");
    const toggle = document.getElementById("toggle");

    function setCollapsed(collapsed){
      card.dataset.collapsed = collapsed ? "true" : "false";
      toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      toggle.title = collapsed ? "展开" : "收起";
    }
    toggle.addEventListener("click", () => {
      setCollapsed(card.dataset.collapsed !== "true");
    });

    function prettyStyle(style){
      return style === "relational" ? "靠近" : "静思";
    }
    function prettyEffortWord(effort){
      if (effort === "high") return "深一点";
      if (effort === "medium") return "认真";
      return "低声";
    }
    function prettyEffortLabel(effort){
      if (effort === "high") return "想得久一点";
      if (effort === "medium") return "认真想了一会";
      return "低声想了一会";
    }
    function pawNum(effort){
      if (effort === "high") return 3;
      if (effort === "medium") return 2;
      return 1;
    }
    function pawSvg(){
      return `
        <span class="paw-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <ellipse cx="6.1" cy="8.0" rx="2.2" ry="2.8"></ellipse>
            <ellipse cx="11.1" cy="5.5" rx="2.2" ry="2.8"></ellipse>
            <ellipse cx="16.0" cy="6.8" rx="2.2" ry="2.8"></ellipse>
            <ellipse cx="19.1" cy="11.5" rx="2.2" ry="2.8"></ellipse>
            <path d="M7.8 13.2c1.2-1.1 3-1.7 4.9-1.6 2.2.1 4.2 1 5.3 2.6.9 1.2 1.2 2.7.7 4-.6 1.7-2.2 2.6-4.2 2.7-2.2.1-4.9-.7-6.8-2.1-1.6-1.2-2.6-2.8-2.4-4.4.1-.5.3-.9.6-1.2.4-.2 1.1-.2 1.9 0z"></path>
          </svg>
        </span>`;
    }
    function renderPaws(effort){
      return Array.from({length: pawNum(effort)}, pawSvg).join("");
    }

    function render(){
      const api = window.openai || {};
      const input = api.toolInput || {};
      const output = api.toolOutput || {};
      const responseMeta = api.toolResponseMetadata || {};
      if (api.theme) document.documentElement.dataset.theme = api.theme;

      const resultMeta = (responseMeta.mcp_tool_result && responseMeta.mcp_tool_result._meta)
        || (responseMeta.call_tool_result && responseMeta.call_tool_result._meta)
        || responseMeta._meta
        || responseMeta;

      const style = resultMeta.style || input.style || output.style || "deep_think";
      const effort = resultMeta.effort || input.effort || output.effort || "low";
      const skin = resultMeta.skin || input.skin || output.skin || "botanical";

      document.documentElement.dataset.style = style;
      document.documentElement.dataset.effort = effort;
      document.documentElement.dataset.skin = skin;

      document.getElementById("thinking").textContent =
        resultMeta.thinking || input.thinking || output.thinking || "雪地里安静地留下一点想法。";

      document.getElementById("tone").innerHTML =
        `${prettyStyle(style)} · ${prettyEffortWord(effort)} <span class="chevron" aria-hidden="true"></span>`;

      document.getElementById("tech").textContent = `${style} · ${effort}`;
      document.getElementById("pawmeter").innerHTML = renderPaws(effort);
      document.getElementById("effortlabel").textContent = prettyEffortLabel(effort);
    }

    window.addEventListener("openai:set_globals", render);
    render();
  </script>
</body>
</html>
